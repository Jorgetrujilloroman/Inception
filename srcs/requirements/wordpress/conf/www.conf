[www]
; Standard user and group for web processes
user = www-data
group = www-data

; Listen on port 9000 to communicate with NGINX via the internal network
listen = 9000

; Set permissions for the socket if it were used, but we use port 9000
listen.owner = www-data
listen.group = www-data

; Process management settings to optimize resource usage
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
