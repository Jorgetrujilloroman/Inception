server {
    # Listen only on port 443 for SSL/TLS connections
    listen 443 ssl;
    listen [::]:443 ssl;

    #Server name
    server_name jotrujil.42.fr;

    # SSL/TLS certificate and key paths
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Strictly use TLS v1.2 or v1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    # Root directory and default index files
    root /var/www/wordpress;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pass PHP scripts to FastCGI server (WordPress container)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # FastCGI will point to the wordpress container on port 9000
        fastcgi_pass wordpress:9000;
    }
}
